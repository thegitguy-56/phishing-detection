name: QA Automation & Test Execution Dashboard

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-test-execution:
    name: 🛡️ Run QA Automation & Generate Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt

      - name: 📦 Install QA Framework & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests httpx fastapi uvicorn pandas numpy python-dotenv

      - name: 🚀 Run Full QA Pipeline (300 Selenium + 300 API + Load + Vulnerability)
        run: |
          python -m qa_automation.run_qa_pipeline \
            --output-dir qa_reports \
            --excel-name AmbiEye_PhishGuard_Test_Report.xlsx

      - name: 📊 Upload Excel Test Execution Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AmbiEye-PhishGuard-QA-Test-Report-Excel
          path: qa_reports/AmbiEye_PhishGuard_Test_Report.xlsx
          retention-days: 30

      - name: 📋 Publish Dashboard to GitHub Step Summary
        if: always()
        run: |
          if [ -f qa_reports/test_summary.md ]; then
            cat qa_reports/test_summary.md >> $GITHUB_STEP_SUMMARY
          fi
